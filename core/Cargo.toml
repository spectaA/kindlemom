[package]
name = "kindlemom-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "WebAssembly bindings around boko for the Kindlemom web app"

[lib]
crate-type = ["cdylib"]

[dependencies]
boko = { git = "https://github.com/zacharydenton/boko", rev = "b148716498fdac70134555293a7405913988256a", default-features = false }
wasm-bindgen = "=0.2.108"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
